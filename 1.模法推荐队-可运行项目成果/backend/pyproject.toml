[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-market-assistant"
version = "0.1.0"
description = "面向银行模型市场的大模型智能推荐助手后端服务"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "team-16" },
]
keywords = ["fastapi", "banking", "model-market", "recommendation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/xyzshiyi-pixel/team-16"
Documentation = "https://github.com/xyzshiyi-pixel/team-16#readme"
Repository = "https://github.com/xyzshiyi-pixel/team-16"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
