name: CI

on:
  push:
    branches: [main, develop, "agent-*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Check import syntax
        run: |
          python -m compileall app/ tests/

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          ENABLE_MOCK: "true"
          LOG_LEVEL: "ERROR"

  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: [backend-tests]

    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate data (if script exists)
        run: |
          if [ -f scripts/validate_data.py ]; then
            python scripts/validate_data.py
          else
            echo "Data validation script not yet available (Agent B responsibility)."
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker compose build backend

      - name: Start services
        run: |
          docker compose up -d backend
          sleep 5
          docker compose ps

      - name: Test health endpoint
        run: |
          sleep 3
          curl -s http://localhost:8000/api/v1/health | python -c "import sys,json; data=json.load(sys.stdin); assert data['status']=='healthy'; print('Health check passed:', data)"

      - name: Test API endpoint
        run: |
          curl -s -X POST http://localhost:8000/api/v1/parse-demand \
            -H "Content-Type: application/json" \
            -d '{"raw_text": "县域新客首贷营销"}' | \
            python -c "import sys,json; data=json.load(sys.stdin); assert data['intent']=='customer_marketing'; print('Parse endpoint passed:', data['intent'])"

      - name: Cleanup
        run: |
          docker compose down
